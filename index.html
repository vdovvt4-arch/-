<script>
  // 1. نظام إظهار وإخفاء كلمة المرور
  function togglePass(id, btn) {
    const el = document.getElementById(id);
    const isPassword = el.type === "password";
    el.type = isPassword ? "text" : "password";
    btn.textContent = isPassword ? "🙈" : "👁";
  }

  // 2. نظام التنقل بين النوافذ (Tabs)
  const tabs = document.querySelectorAll('.auth-tab');
  const forms = document.querySelectorAll('.auth-form');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      // إزالة الكلاس النشط من جميع التابات والفورمات
      tabs.forEach(t => t.classList.remove('active'));
      forms.forEach(f => f.classList.remove('active-form'));
      
      // إضافة الكلاس النشط للتاب المحدد والفورم الخاص به
      tab.classList.add('active');
      const targetFormId = tab.getAttribute('data-target');
      document.getElementById(targetFormId).classList.add('active-form');
    });
  });

  // 3. نظام الوضع الليلي والنهاري المحسن
  const themeBtn = document.getElementById('themeToggle');
  const htmlDoc = document.documentElement;
  
  // التحقق من وجود تفضيل سابق للمستخدم في المتصفح
  const savedTheme = localStorage.getItem('tebbiya-theme') || 'light';
  htmlDoc.setAttribute('data-theme', savedTheme);
  themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

  themeBtn.addEventListener('click', () => {
    const currentTheme = htmlDoc.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    
    htmlDoc.setAttribute('data-theme', newTheme);
    localStorage.setItem('tebbiya-theme', newTheme); // حفظ الاختيار
    
    // تغيير الأيقونة
    themeBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
  });
</script>
