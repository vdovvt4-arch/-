<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طبيّة | المنصة التعليمية</title>
<meta name="theme-color" content="#14304A">
<link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="shortcut icon" href="icon-192.png">
<script>
  (function(){
    var t = localStorage.getItem('tibbiya-theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Theme Toggle -->
<button class="theme-toggle-btn" id="themeToggle" style="position:absolute; top:20px; left:20px;" aria-label="تبديل النمط">🌙</button>
  <button id="langToggle" data-i18n-lang-label style="position:absolute; top:20px; left:80px; background:transparent; border:0; font-weight:800; cursor:pointer;">English</button>

<div class="auth-wrap">
  <div class="auth-hero">
    <svg class="mark" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="32" fill="var(--primary)"/>
      <path d="M18 50 V24 A14 14 0 0 1 46 24 V50 Z" fill="var(--bg-main)"/>
      <rect x="6" y="20" width="9" height="32" rx="1.5" fill="var(--accent)" transform="rotate(-28 15 52)"/>
      <rect x="49" y="20" width="9" height="32" rx="1.5" fill="var(--accent)" transform="rotate(28 49 52)"/>
    </svg>
    <h1 class="auth-title" data-site-title data-i18n="auth_title">منصة طبيّة 🩺</h1>
    <p class="auth-sub" data-i18n="auth_sub">بوابتك للتعلم الطبي الشامل والمتكامل</p>

    <div class="live-counter">
      <div class="pulse-dot"></div>
      <span id="liveCounterText" data-i18n="loading">يتم حساب الطلاب...</span>
    </div>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" data-i18n="login_tab">دخول</button>
      <button class="auth-tab" data-tab="student" data-i18n="student_tab">حساب طالب</button>
      <button class="auth-tab" data-tab="teacher" data-i18n="teacher_tab">انضم كأستاذ</button>
    </div>

    <!-- Login Form -->
    <form id="form-login" class="email-form" novalidate>
      <div class="form-group">
        <label data-i18n="email_label">البريد الإلكتروني</label>
        <input id="lEmail" type="email" data-i18n-placeholder="email_label" placeholder="student@example.com" required>
      </div>
      <div class="form-group">
        <label data-i18n="password_label">كلمة المرور</label>
        <div class="password-wrap">
          <input id="lPass" type="password" placeholder="••••••••" required>
          <button type="button" class="eye-btn" onclick="togglePass('lPass', this)">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="btnLogin" data-i18n="login_button">دخول</button>
    </form>

    <!-- Student Register Form -->
    <form id="form-student" class="email-form" style="display:none;" novalidate>
      <div class="form-group">
        <label data-i18n="full_name_label">الاسم الكامل</label>
        <input id="sName" type="text" placeholder="أحمد محمد" required>
      </div>
      <div class="form-group">
        <label data-i18n="email_label">البريد الإلكتروني</label>
        <input id="sEmail" type="email" placeholder="student@example.com" required>
      </div>
      <div class="form-group">
        <label data-i18n="password_label">كلمة المرور</label>
        <div class="password-wrap">
          <input id="sPass" type="password" placeholder="6 أحرف على الأقل" required>
          <button type="button" class="eye-btn" onclick="togglePass('sPass', this)">👁️</button>
        </div>
      </div>
      <div class="checkbox-wrap">
        <input type="checkbox" id="sTerms" required>
        <label for="sTerms"><span data-i18n="terms_accept">أوافق على</span> <a href="terms.html" target="_blank" data-i18n="terms_link">شروط الاستخدام</a></label>
      </div>
      <button type="submit" class="btn-primary" id="btnStudent" data-i18n="student_register_button">إنشاء حساب طالب</button>
    </form>

    <!-- Teacher Register Form -->
    <form id="form-teacher" class="email-form" style="display:none;" novalidate>
      <div class="form-group">
        <label data-i18n="full_name_label">الاسم الكامل</label>
        <input id="tName" type="text" placeholder="د. سارة أحمد" required>
      </div>
      <div class="form-group">
        <label data-i18n="email_label">البريد الإلكتروني</label>
        <input id="tEmail" type="email" placeholder="doctor@hospital.com" required>
      </div>
      <div class="form-group">
        <label data-i18n="password_label">كلمة المرور</label>
        <div class="password-wrap">
          <input id="tPass" type="password" placeholder="••••••••" required>
          <button type="button" class="eye-btn" onclick="togglePass('tPass', this)">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label data-i18n="specialty_label">التخصص</label>
        <input id="tSpecialty" type="text" placeholder="تشريح / كيمياء حيوية ..." required>
      </div>
      <div class="checkbox-wrap">
        <input type="checkbox" id="tTerms" required>
        <label for="tTerms"><span data-i18n="terms_accept">أوافق على</span> <a href="terms.html" target="_blank" data-i18n="terms_link">شروط الاستخدام</a></label>
      </div>
      <button type="submit" class="btn-primary" id="btnTeacher" data-i18n="teacher_register_button">إرسال طلب الانضمام</button>

      <!-- Success Message for Teacher -->
      <div id="teacherSuccess" class="notice-box" style="display:none; margin-top:16px;" data-i18n="join_teacher_success">
        ✅ تم الإرسال! سيتم إشعار الإدارة بطلبك وسنقوم بتفعيل حسابك قريباً.
      </div>
    </form>

  </div>
</div>

<div class="toast" id="toast" role="alert"></div>

<div class="brand-popup" id="brandPopup" aria-live="polite">
  <div class="brand-popup-card">
    <img class="brand-popup-image" src="assets/brand-popup.jpg" alt="The easiest in dentistry" />
  </div>
</div>

<!-- Dev panel: only visible on local files for testing -->
<div id="devPanel" style="position:fixed; right:12px; bottom:120px; z-index:9999; display:none; gap:8px; flex-direction:column;">
  <button class="btn-primary" onclick="(function(){ localStorage.setItem('tibbiya_current_user', JSON.stringify('demo_student')); alert('تسجيل دخول كمستخدم demo_student'); window.location.href='app.html'; })()">دخول كطالب (demo_student)</button>
  <button class="btn-primary" onclick="(function(){ localStorage.setItem('tibbiya_current_user', JSON.stringify('demo_teacher')); alert('تسجيل دخول كمستخدم demo_teacher'); window.location.href='teacher.html'; })()">دخول كأستاذ (demo_teacher)</button>
  <button class="btn-primary" onclick="(function(){ localStorage.setItem('tibbiya_current_user', JSON.stringify('demo_admin')); alert('تسجيل دخول كمسؤول (demo_admin)'); window.location.href='admin.html'; })()">دخول كمسؤول (demo_admin)</button>
  <button class="btn-primary" style="background:#D64545" onclick="(function(){ localStorage.removeItem('tibbiya_current_user'); localStorage.removeItem('tibbiya_current_profile'); sessionStorage.removeItem('tibbiya_session_id'); alert('تم تسجيل الخروج المحلي'); window.location.href='index.html'; })()">مسح تسجيل الدخول المحلي</button>
</div>

<script>
  function togglePass(id, btn) {
    const el = document.getElementById(id);
    el.type = el.type === "password" ? "text" : "password";
    btn.textContent = el.type === "password" ? "👁️" : "🙈";
  }
  // show devPanel when running locally (file://) or on localhost
  try{
    if(location.protocol === 'file:' || location.hostname === 'localhost'){
      document.getElementById('devPanel').style.display = 'flex';
    }
  }catch(e){}
</script>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-contact">
      <div class="footer-qr">
        <a href="https://t.me/FordeReter" target="_blank" rel="noopener">
          <img src="assets/telegram-qr.png" alt="QR تليجرام">
        </a>
      </div>
      <div class="footer-text">
        <h4>تواصل معنا</h4>
        <p><a class="telegram-link" href="https://t.me/FordeReter" data-site-telegram target="_blank" rel="noopener">تابعنا على تليجرام</a></p>
      </div>
    </div>
    <div class="footer-note" data-site-footer>© 2026 طبيّة — جميع الحقوق محفوظة</div>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script type="module" src="js/firebase-client.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/visitor-counter.js"></script>
<script type="module" src="js/auth-page.js"></script>
<script>
  // language toggle handler
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('langToggle');
    if(!btn) return;
    btn.addEventListener('click', () => {
      const cur = I18N.get();
      I18N.set(cur === 'ar' ? 'en' : 'ar');
      // after toggle, refresh page text if needed
    });
  });
</script>
</body>
</html>
