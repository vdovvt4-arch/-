<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طبيّة | الرئيسية</title>
<meta name="theme-color" content="#14304A">
<link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="shortcut icon" href="icon-192.png">
<script>
  (function(){
    var t = localStorage.getItem('tibbiya-theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/i18n.js"></script>
</head>
<body>

<div id="authGuard" class="auth-guard-overlay"><div class="guard-spinner"></div></div>

<div id="appShell" style="display:none;">
  <header class="app-header">
    <div class="app-brand">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="32" fill="var(--primary)"/>
        <path d="M18 50 V24 A14 14 0 0 1 46 24 V50 Z" fill="var(--bg-main)"/>
        <rect x="6" y="20" width="9" height="32" rx="1.5" fill="var(--accent)" transform="rotate(-28 15 52)"/>
        <rect x="49" y="20" width="9" height="32" rx="1.5" fill="var(--accent)" transform="rotate(28 49 52)"/>
      </svg>
      <span data-site-title data-i18n="site_title">طبيّة</span>
    </div>
    <div class="app-header-actions">
      <button class="theme-toggle-btn" id="appThemeToggle" aria-label="تبديل النمط">🌙</button>
      <button id="langToggle" data-i18n-lang-label style="background:transparent;border:0;font-weight:800;cursor:pointer;margin-inline-start:8px;">English</button>
      <button class="user-profile-btn" id="btnLogout" title="تسجيل الخروج">
        <div class="avatar" id="userAvatar">ط</div>
        <span id="userName">جاري التحميل...</span>
      </button>
    </div>
  </header>

  <main class="main-content">
    <div class="welcome-banner">
      <h1 id="welcomeText" data-i18n="welcome">مرحباً بك!</h1>
      <p data-i18n="start_learning">ابدأ رحلة التعلم الطبي وتصفح المواد الدراسية.</p>
    </div>

    <div id="smartInsights" class="smart-insights"></div>

    <div class="subjects-grid" id="subjectsGrid">
      <!-- Loaded dynamically -->
    </div>
  </main>
</div>

<!-- Subject Modal -->
<div class="modal-overlay" id="subjectModal" style="display:none;">
  <div class="modal-dialog">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">اسم المادة</div>
      <button class="close-modal" id="closeModal">×</button>
    </div>
    <div class="admin-tabs" style="padding: 1rem 1.5rem 0;">
      <button class="admin-tab active" data-msubtab="sub-lec">🎬 المحاضرات</button>
      <button class="admin-tab" data-msubtab="sub-mat">📄 الملازم</button>
    </div>
    <div class="modal-body admin-subtab active" id="sub-lec">
      <div id="modalLecturesList">جاري التحميل...</div>
    </div>
    <div class="modal-body admin-subtab" id="sub-mat">
      <div id="modalMaterialsList">جاري التحميل...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="alert"></div>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-contact">
      <div class="footer-qr">
        <a href="https://t.me/FordeReter" target="_blank" rel="noopener">
          <img src="assets/telegram-qr.png" alt="QR تليجرام">
        </a>
      </div>
      <div class="footer-text">
        <h4>تواصل معنا</h4>
        <p><a class="telegram-link" href="https://t.me/FordeReter" data-site-telegram target="_blank" rel="noopener">تابعنا على تليجرام</a></p>
      </div>
    </div>
    <div class="footer-note" data-site-footer>© 2026 طبيّة — جميع الحقوق محفوظة</div>
  </div>
</footer>

<script type="module" src="js/firebase-client.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/visitor-counter.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', ()=>{
    const btn = document.getElementById('langToggle');
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      const cur = I18N.get();
      I18N.set(cur === 'ar' ? 'en' : 'ar');
    });
  });
</script>
</body>
</html>
